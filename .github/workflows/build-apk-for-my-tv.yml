# Fork-only helper: build the launcher from this checkout on GitHub's runner and keep the APK as a
# workflow artifact for 7 days. Mirrors the "Launcher build" job in ci.yml (JDK 17, Gradle, no daemon).
# Not meant for a pull request to the upstream repo.
name: Build APK for my TV
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
